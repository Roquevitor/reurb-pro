name: REURB Pro checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/multiempresa-equipes]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: pip install -r reurb/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q reurb
      - name: Run workspace migration tests
        working-directory: reurb
        run: python -m unittest discover -v -p 'test_*.py'
